name: Optimized AOT Release with Caching

on:
  push:
    tags: ['v*.*.*']

env:
  DOTNET_VERSION: '10.0.x'
  
jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4
      
    - uses: actions/setup-dotnet@v5.0.1
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Cache AOT build
      uses: actions/cache@v3
      with:
        path: obj
        key: ${{ runner.os }}-aot-${{ github.sha }}
        
    - name: Build and Package
      shell: pwsh
      run: |
        # 构建
        dotnet publish .\MMP.csproj `
          -r win-x64 -c Release `
          --self-contained `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=true `
          -p:PublishAot=true `
          -p:InvariantGlobalization=true `
          -o publish
          
        # 确保 7z 可用
        if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
          choco install 7zip -y
        }
        
        # 打包
        $archive = "MMP-${{ github.ref_name }}-win-x64.7z"
        7z a -t7z -mx=9 -m0=lzma2 "$archive" "./publish/*"
        
        # 生成校验和
        (Get-FileHash "$archive" -Algorithm SHA256).Hash | Out-File "$archive.sha256"
        
    - uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: "Release ${{ github.ref_name }}"
        files: |
          MMP-${{ github.ref_name }}-win-x64.7z
          MMP-${{ github.ref_name }}-win-x64.7z.sha256
